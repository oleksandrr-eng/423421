<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3fb6ff">
<title>Wheel of Destiny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10213a; --sky1:#3fb6ff; --sky2:#bdeaff; --grass1:#5fd34a; --grass2:#2f9e2c;
  --yellow:#ffd23f; --orange:#ff9a1f; --green:#35d45a; --blue:#2f8bff; --red:#ff4b4b; --purple:#a35bff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0d1b2e;color:#fff;font-family:'Fredoka',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{display:flex;align-items:center;justify-content:center}
.chunky{font-family:'Lilita One','Fredoka',system-ui,sans-serif;letter-spacing:.01em;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}

.phone{position:relative;width:100vw;height:100dvh;overflow:hidden;display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg,var(--sky1) 0%,#7fd2ff 35%,var(--sky2) 56%)}
@media (min-width:500px){
  body{background:radial-gradient(900px 600px at 30% 20%,#1d3c66,#0b1424 70%)}
  .phone{width:390px;height:844px;border-radius:54px;box-shadow:0 0 0 11px #1a1a1a,0 0 0 13px #2c2c2c,0 40px 120px rgba(0,0,0,.7)}
  .phone::before{content:"";position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:90}
}

/* blurred blocky world */
.world{position:absolute;inset:-24px;z-index:0;pointer-events:none;overflow:hidden;filter:blur(5px) saturate(1.1);transform:scale(1.03)}
.sun{position:absolute;top:80px;right:-20px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#fff9c4 0 38%,#ffe066 39% 55%,rgba(255,224,102,0) 72%)}
.cloud{position:absolute;height:26px;background:#fff;border-radius:6px;animation:cloud linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:6px}
.cloud::before{width:44%;height:26px;left:16%;top:-17px}
.cloud::after{width:30%;height:20px;left:52%;top:-11px}
@keyframes cloud{from{transform:translateX(-160px)}to{transform:translateX(580px)}}
.hills{position:absolute;left:0;right:0;top:51%;height:70px}
.hill{position:absolute;bottom:0;background:#4fbf47;border:3px solid var(--ink);border-bottom:none;border-radius:10px 10px 0 0}
.tree{position:absolute;bottom:0;width:34px}
.tree i{display:block;margin:0 auto;width:10px;height:18px;background:#8a5a2b;border:2px solid var(--ink);border-top:none}
.tree b{display:block;width:34px;height:34px;background:#2fa344;border:3px solid var(--ink);border-radius:6px}
.ground{position:absolute;left:-30%;right:-30%;top:58%;bottom:-10%;background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 2px,transparent 2px 46px),
  repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 2px,transparent 2px 46px),
  linear-gradient(180deg,var(--grass1),var(--grass2));transform:perspective(300px) rotateX(38deg);transform-origin:top;border-top:4px solid var(--ink)}
.fence{position:absolute;left:0;right:0;top:calc(58% - 22px);height:24px;background:repeating-linear-gradient(90deg,#e0a35a 0 10px,transparent 10px 34px);border-bottom:6px solid #c47f37}
#sparkles,#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#sparkles{z-index:1} #confetti{z-index:65}

/* HUD */
.status{position:relative;z-index:5;width:100%;height:50px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 4px;font-weight:700;font-size:15px;color:var(--ink)}
.status .icons{display:flex;gap:6px;align-items:center}
.hud{position:relative;z-index:5;width:100%;flex:none;display:flex;justify-content:flex-end;padding:6px 14px 0;height:44px}
.inv{display:flex;align-items:center;gap:6px;background:#fff;border:4px solid var(--ink);border-radius:14px;padding:3px 10px 4px 6px;box-shadow:0 4px 0 var(--ink);font-family:'Lilita One',sans-serif;font-size:17px;color:var(--ink)}
.inv .ic{font-size:20px}
.inv.bump{animation:bump .3s ease-out}
@keyframes bump{40%{transform:scale(1.18)}}

.logo{position:relative;z-index:5;flex:none;text-align:center;line-height:.9;margin-top:34px;transform:rotate(-3deg)}
.logo .a{font-size:42px;color:var(--yellow)}
.logo .b{display:inline-block;margin-top:4px;font-family:'Lilita One',sans-serif;font-size:17px;color:#fff;background:linear-gradient(90deg,#a35bff,#ff4bd8);border:3px solid var(--ink);border-radius:10px;padding:3px 12px 5px;box-shadow:0 4px 0 var(--ink);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}

/* wheel */
.wheelwrap{position:relative;z-index:5;flex:none;width:344px;height:344px;margin-top:36px}
.wheelwrap .glow{position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(circle,rgba(255,240,150,.85) 0 45%,rgba(255,240,150,0) 70%);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.05);opacity:.75}}
.rim{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#ffe680 0 60%,#ffb21f 61% 100%);border:5px solid var(--ink);box-shadow:0 7px 0 var(--ink),inset 0 0 0 4px rgba(255,255,255,.45)}
.bulb{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff6c8;border:2px solid var(--ink);box-shadow:0 0 8px #fff3a0;animation:blink 1s steps(1) infinite}
.bulb:nth-child(odd){animation-delay:-.5s}
@keyframes blink{50%{background:#ff7a3c;box-shadow:0 0 10px #ff7a3c}}
.spinning .bulb{animation-duration:.25s}
.wheel{position:absolute;inset:20px;border-radius:50%;border:5px solid var(--ink);overflow:hidden;background:var(--ink)}
.wheel svg{display:block;width:100%;height:100%;will-change:transform}
.hub{position:absolute;left:50%;top:50%;width:78px;height:78px;margin:-39px 0 0 -39px;border-radius:50%;border:5px solid var(--ink);cursor:pointer;
  background:radial-gradient(circle at 40% 35%,#fff6c8,#ffd23f 50%,#ff9a1f);box-shadow:0 5px 0 var(--ink),inset 0 -6px 0 rgba(0,0,0,.15);
  display:grid;place-items:center;font-family:'Lilita One',sans-serif;font-size:20px;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
.hub:active{transform:translateY(3px)}
.pointer{position:absolute;left:50%;top:-14px;width:46px;height:58px;margin-left:-23px;z-index:3;transform-origin:50% 22%;filter:drop-shadow(0 4px 0 var(--ink))}
.pointer.tick{animation:tick .12s ease-out}
@keyframes tick{40%{transform:rotate(-16deg)}}

.spinrow{position:relative;z-index:5;flex:none;width:100%;display:flex;justify-content:center;margin-top:32px}
.spinrow .inv{position:absolute;right:12px;top:50%;margin-top:-22px;flex-direction:column;gap:0;padding:2px 8px 3px;line-height:1}
.spin{position:relative;z-index:5;flex:none;width:230px;border:5px solid var(--ink);border-radius:18px;padding:10px 0 13px;cursor:pointer;
  background:linear-gradient(180deg,#6dff8c,#1fc94a);color:#fff;font-family:'Lilita One',sans-serif;font-size:34px;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;
  box-shadow:0 7px 0 var(--ink),inset 0 -8px 0 rgba(0,0,0,.18),inset 0 6px 0 rgba(255,255,255,.4);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.spin:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.spin:disabled{filter:grayscale(.6) brightness(.9);animation:none;cursor:default}

/* result */
.modal{position:absolute;inset:0;z-index:60;background:rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.open{opacity:1;pointer-events:auto}
.panel{position:relative;width:100%;border:5px solid var(--ink);border-radius:26px;text-align:center;box-shadow:0 8px 0 var(--ink),0 0 60px rgba(255,236,120,.7),0 0 120px rgba(80,190,255,.6);transform:scale(.5) rotate(-6deg);transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
.modal.open .panel{transform:scale(1) rotate(0)}
.panel .in{position:relative;overflow:hidden;border-radius:20px;padding:44px 20px 22px;background:radial-gradient(120% 70% at 50% 0%,#8fe0ff 0%,#3fa8ff 45%,#1f6fe0 100%);box-shadow:inset 0 0 0 4px rgba(255,255,255,.45)}
.panel canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.prays{position:absolute;left:50%;top:120px;width:600px;height:600px;margin:-300px 0 0 -300px;pointer-events:none;opacity:.65;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.6) 0 8deg,transparent 8deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%);animation:spin 10s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ttl{position:absolute;top:-24px;left:50%;transform:translateX(-50%);z-index:3;white-space:nowrap;font-size:24px;color:#fff;background:var(--orange);border:5px solid var(--ink);border-radius:16px;padding:4px 18px 7px;box-shadow:0 5px 0 var(--ink);-webkit-text-stroke:4px var(--ink)}
.prize{position:relative;width:170px;height:150px;margin:0 auto;object-fit:contain;filter:drop-shadow(0 0 18px rgba(255,255,255,.9)) drop-shadow(0 6px 0 rgba(16,33,58,.4));animation:float 2.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-3deg)}}
.pname{position:relative;font-size:27px;color:var(--yellow);margin-top:10px;line-height:1.05}
.tags{position:relative;display:flex;gap:8px;justify-content:center;margin-top:10px}
.tag{font-family:'Lilita One',sans-serif;font-size:15px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;border:3px solid var(--ink);border-radius:10px;padding:2px 10px 4px;box-shadow:0 3px 0 var(--ink)}
.tag.type{background:#fff;color:var(--ink);-webkit-text-stroke:0}
.rainbow{background:linear-gradient(90deg,#ff5a5a,#ffcb3d,#4be36b,#3fb6ff,#b46bff,#ff5a5a);background-size:300% 100%;animation:rb 2s linear infinite}
@keyframes rb{to{background-position:300% 0}}
.btn{position:relative;display:block;width:100%;margin-top:14px;border:4px solid var(--ink);border-radius:16px;padding:12px;cursor:pointer;color:#fff;font-family:'Lilita One',sans-serif;font-size:22px;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;box-shadow:0 6px 0 var(--ink),inset 0 -7px 0 rgba(0,0,0,.18),inset 0 5px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn.g{background:linear-gradient(180deg,#5cff7d,#1fc94a);font-size:26px}
.btn.o{background:var(--orange);font-size:19px;padding:9px}
.getbtn{position:relative;z-index:5;flex:none;margin-top:18px;width:230px;border:5px solid var(--ink);border-radius:18px;padding:9px 0 12px;cursor:pointer;
  background:linear-gradient(180deg,#6fc2ff,#2f7bff);color:#fff;font-family:'Lilita One',sans-serif;font-size:26px;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;
  box-shadow:0 7px 0 var(--ink),inset 0 -8px 0 rgba(0,0,0,.18),inset 0 6px 0 rgba(255,255,255,.4)}
.getbtn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.bagrid{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:20px}
.bagrid .it{position:relative;width:62px;height:62px;border:3px solid var(--ink);border-radius:12px;background:var(--c);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center}
.bagrid .it img{width:50px;height:50px;object-fit:contain}
.bagrid .it b{position:absolute;right:-8px;top:-9px;background:var(--red);border:3px solid var(--ink);border-radius:9px;padding:0 5px 1px;font-family:'Lilita One',sans-serif;font-size:12px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.bagrid .empty{font-size:64px;line-height:1}
.ptext{position:relative;margin-top:6px;font-weight:700;font-size:15px;line-height:1.45;text-shadow:0 2px 0 rgba(16,33,58,.6)}
.ptext b{color:var(--yellow)}
.prog{position:relative;height:24px;margin-top:14px;border:4px solid var(--ink);border-radius:12px;background:#1c2b42;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(180deg,#ffe680,#ffb21f);box-shadow:inset 0 5px 0 rgba(255,255,255,.4);transition:width .3s}
.step{position:relative;margin-top:10px;min-height:22px;font-family:'Lilita One',sans-serif;font-size:16px;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.claimnow{font-size:30px;animation:claim 1s ease-in-out infinite}
@keyframes claim{50%{transform:scale(1.06);box-shadow:0 6px 0 var(--ink),0 0 40px rgba(80,255,120,.9)}}
.reveal{position:absolute;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:radial-gradient(circle at 50% 35%,#ffe680 0,#ff9a1f 45%,#ff4b4b 100%)}
.reveal.open{display:flex;animation:shake .45s steps(3) 2}
@keyframes shake{25%{transform:translate(-6px,3px) rotate(-1deg)}50%{transform:translate(6px,-3px) rotate(1deg)}75%{transform:translate(-3px,-2px)}}
.reveal .emoji{font-size:100px;line-height:1;filter:drop-shadow(0 6px 0 var(--ink))}
.reveal h1{font-size:56px;line-height:.95;color:#fff;margin-top:14px;transform:rotate(-3deg)}
.reveal p{margin-top:16px;font-weight:700;font-size:17px;line-height:1.45;color:#fff;text-shadow:0 2px 0 rgba(16,33,58,.7)}
.reveal .stat{margin-top:20px;background:#fff;border:4px solid var(--ink);border-radius:18px;padding:10px 26px 12px;box-shadow:0 5px 0 var(--ink);color:var(--ink);font-weight:700}
.reveal .stat b{display:block;font-family:'Lilita One',sans-serif;font-size:40px;color:var(--orange);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
.reveal .btn{max-width:290px}
.inc{position:relative;margin-top:10px;font-size:26px;color:#7dff8f}
.wheel.refresh{animation:refresh .5s ease-out}
@keyframes refresh{0%{filter:brightness(1)}40%{filter:brightness(2.2) saturate(1.4);transform:scale(.94)}100%{filter:brightness(1);transform:scale(1)}}
.newtag{position:absolute;left:50%;top:50%;z-index:4;white-space:nowrap;font-size:26px;color:#fff;background:var(--purple);border:4px solid var(--ink);border-radius:14px;padding:3px 14px 6px;box-shadow:0 5px 0 var(--ink);-webkit-text-stroke:4px var(--ink);pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.5)}
.newtag.on{animation:newtag 1.3s ease-out}
@keyframes newtag{0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(-8deg)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(-4deg)}75%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-4deg)}100%{opacity:0;transform:translate(-50%,-90%) scale(.9) rotate(-4deg)}}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="world" aria-hidden="true">
    <div class="sun"></div>
    <div class="cloud" style="top:100px;width:110px;animation-duration:38s;animation-delay:-6s"></div>
    <div class="cloud" style="top:180px;width:80px;animation-duration:30s;animation-delay:-20s"></div>
    <div class="cloud" style="top:260px;width:120px;animation-duration:46s;animation-delay:-33s"></div>
    <div class="hills">
      <div class="hill" style="left:-20px;width:150px;height:46px"></div>
      <div class="hill" style="left:220px;width:200px;height:60px;background:#45b23f"></div>
      <div class="tree" style="left:40px"><b></b><i></i></div>
      <div class="tree" style="left:300px;transform:scale(1.2);transform-origin:bottom"><b></b><i></i></div>
    </div>
    <div class="ground"></div>
    <div class="fence"></div>
  </div>
  <canvas id="sparkles"></canvas>

  <div class="status">
    <span id="clock">9:41</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#10213a"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#10213a"><path d="M8 2.5c2.3 0 4.4.9 6 2.4l1.1-1.2A10.2 10.2 0 0 0 8 .8 10.2 10.2 0 0 0 .9 3.7L2 4.9a8.5 8.5 0 0 1 6-2.4Zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.1-1.2A7 7 0 0 0 8 4.2a7 7 0 0 0-4.7 1.9l1.1 1.2c1-.9 2.2-1.4 3.6-1.4Zm0 3.3c-.6 0-1.1.2-1.5.6L8 11.5l1.5-1.7c-.4-.4-.9-.6-1.5-.6Z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#10213a" opacity=".5"/><rect x="2" y="2" width="17" height="9" rx="2" fill="#10213a"/><rect x="24" y="4.5" width="2" height="4" rx="1" fill="#10213a" opacity=".5"/></svg>
    </span>
  </div>


  <div class="logo">
    <div class="a chunky">STEAL AN EGG</div>
    <div class="b">✦ WHEEL OF DESTINY ✦</div>
  </div>

  <div class="wheelwrap" id="wrap">
    <div class="glow"></div>
    <div class="rim" id="rim"></div>
    <div class="wheel"><svg id="wheel" viewBox="-150 -150 300 300"></svg></div>
    <svg class="pointer" id="pointer" viewBox="0 0 46 58"><path d="M23 56 4 14C1 6 7 2 13 2h20c6 0 12 4 9 12Z" fill="#ff4b4b" stroke="#10213a" stroke-width="4" stroke-linejoin="round"/><circle cx="23" cy="15" r="6" fill="#fff" stroke="#10213a" stroke-width="3"/></svg>
    <button class="hub" id="hub" aria-label="Spin">SPIN</button>
  </div>

  <div class="spinrow"><button class="spin" id="spinBtn">SPIN!</button></div>

  <button class="getbtn" id="getBtn">GET IN GAME</button>

  <div class="modal" id="sendModal"><div class="panel">
    <div class="ttl chunky">GET IN GAME</div>
    <div class="in">
      <canvas id="sendSparkles"></canvas>
      <div class="prays"></div>
      <div class="bagrid" id="bagGrid"></div>
      <div class="pname chunky" id="sendTitle"></div>
      <p class="ptext" id="sendText"></p>
      <div class="prog" id="sendProgWrap" style="display:none"><i id="sendProg"></i></div>
      <div class="step" id="sendStep"></div>
      <button class="btn g" id="sendGo">SEND TO MY GAME</button>
      <button class="btn g claimnow" id="claimNow" style="display:none">CLAIM NOW!</button>
      <button class="btn o" id="sendClose">BACK</button>
    </div>
  </div></div>

  <div class="reveal" id="reveal">
    <div class="emoji">😂</div>
    <h1 class="chunky">YOU GOT<br>PRANKED!</h1>
    <p>None of these items are real. You just spun a picture of a wheel for nothing.</p>
    <div class="stat">Spins wasted<b id="wasted">0</b></div>
    <button class="btn g" id="again">SPIN AGAIN ANYWAY</button>
  </div>

  <div class="modal" id="result"><div class="panel">
    <div class="ttl chunky">YOU GOT!</div>
    <div class="in">
      <canvas id="panelSparkles"></canvas>
      <div class="prays"></div>
      <img class="prize" id="prizeImg" alt="">
      <div class="pname chunky" id="prizeName"></div>
      <div class="tags"><span class="tag" id="prizeRar"></span><span class="tag type" id="prizeType"></span></div>
      <div class="inc chunky" id="prizeInc"></div>
      <button class="btn g" id="claimBtn">CLAIM!</button>
      <button class="btn o" id="againBtn">SPIN AGAIN</button>
    </div>
  </div></div>

  <canvas id="confetti"></canvas>
</div>

<script>
(() => {

  const R = 150, pt = (a, r) => [Math.sin(a * Math.PI / 180) * r, -Math.cos(a * Math.PI / 180) * r];
  function renderWheel(){

  function refreshWheel(){
    const w = document.querySelector('.wheel');
    w.classList.remove('refresh'); void w.offsetWidth; w.classList.add('refresh');
    setTimeout(renderWheel, 220);
  }

  // bulbs around the rim
  const rim = $('rim');
  for (let k = 0; k < 24; k++){
    const b = document.createElement('i'); b.className = 'bulb';
    const a = k * 15 * Math.PI / 180, r = 161;
    b.style.transform = `translate(${(Math.sin(a) * r).toFixed(1)}px,${(-Math.cos(a) * r).toFixed(1)}px)`;
    rim.appendChild(b);
  }

  // ---- spinning
  let rot = 0, spinning = false, invN = 0, lastWon = null; const bag = [];
  const wrap = $('wrap'), pointer = $('pointer');
  const pick = () => Math.floor(Math.random() * N);   // every item equally likely
  function currentAngle(){
    const m = getComputedStyle(svg).transform;
    if (!m || m === 'none') return 0;
    const v = m.match(/matrix\(([^)]+)\)/)[1].split(',').map(Number);
    return (Math.atan2(v[1], v[0]) * 180 / Math.PI + 360) % 360;
  }
  function spin(){
    if (spinning) return;
    spinning = true; spins++; $('spinBtn').disabled = true; wrap.classList.add('spinning');
    const idx = pick();
    const jitter = (Math.random() - .5) * SEG * .7;
    const target = (360 - idx * SEG + jitter) % 360;
    const base = rot - (rot % 360);
    rot = base + 360 * 6 + target;
    svg.style.transition = 'transform 3s cubic-bezier(.15,.66,.1,1)';
    svg.style.transform = `rotate(${rot}deg)`;
    // pointer ticks as each segment edge passes
    let lastSeg = null;
    const watch = () => {
      if (!spinning) return;
      const a = currentAngle();
      const s = Math.floor(((360 - a) + SEG / 2) / SEG) % N;
      if (lastSeg !== null && s !== lastSeg){
        pointer.classList.remove('tick'); void pointer.getBoundingClientRect(); pointer.classList.add('tick');
        if (navigator.vibrate) try { navigator.vibrate(4); } catch(e){}
      }
      lastSeg = s; requestAnimationFrame(watch);
    };
    requestAnimationFrame(watch);
    setTimeout(() => {
      spinning = false; wrap.classList.remove('spinning');
      showResult(wheelItems[idx]);
    }, 3080);
  }
  $('spinBtn').onclick = spin;
  $('hub').onclick = spin;

  function showResult(it){
    lastWon = it;
    $('prizeImg').src = it.img;
    $('prizeName').textContent = it.name;
    const r = $('prizeRar'); r.textContent = it.rar; r.className = 'tag';
    const rc = RAR_COL[it.rar];
    if (rc === 'rainbow') { r.classList.add('rainbow'); r.style.background = ''; } else r.style.background = rc;
    $('prizeType').textContent = it.type;
    $('prizeInc').textContent = it.inc;
    $('result').classList.add('open');
    confetti();
    if (navigator.vibrate) try { navigator.vibrate([40,30,60]); } catch(e){}
  }
  function claim(){
    $('result').classList.remove('open');
    if (lastWon) bag.push(lastWon); lastWon = null;
    invN = bag.length;
    refreshWheel();
    $('spinBtn').disabled = false;
  }
  $('claimBtn').onclick = claim;
  $('againBtn').onclick = () => { claim(); setTimeout(spin, 350); };

  // ---- GET IN GAME → sending → Congratulations → CLAIM NOW! → prank
  let spins = 0;
  const _spin = spin;
  function openSend(){
    const grid = $('bagGrid'); grid.innerHTML = '';
    $('sendProgWrap').style.display = 'none'; $('sendStep').textContent = '';
    $('claimNow').style.display = 'none'; $('sendClose').style.display = '';
    if (!bag.length){
      grid.innerHTML = '<div class="empty">🎒</div>';
      $('sendTitle').textContent = 'NO ITEMS YET';
      $('sendText').textContent = 'Spin the wheel and claim a prize first!';
      $('sendGo').style.display = 'none';
    } else {
      const counts = new Map(); bag.forEach(it => counts.set(it, (counts.get(it) || 0) + 1));
      counts.forEach((n, it) => {
        const d = document.createElement('div'); d.className = 'it'; d.style.setProperty('--c', it.col);
        d.innerHTML = '<img src="' + it.img + '" alt="">' + (n > 1 ? '<b>x' + n + '</b>' : '');
        grid.appendChild(d);
      });
      $('sendTitle').textContent = bag.length + (bag.length === 1 ? ' ITEM' : ' ITEMS');
      $('sendText').textContent = 'Send your prizes straight into Steal an Egg.';
      $('sendGo').style.display = '';
    }
    $('sendModal').classList.add('open');
  }
  $('getBtn').onclick = openSend;
  $('sendClose').onclick = () => $('sendModal').classList.remove('open');
  $('sendGo').onclick = () => {
    $('sendGo').style.display = 'none'; $('sendClose').style.display = 'none';
    $('sendProgWrap').style.display = ''; const bar = $('sendProg'); bar.style.width = '0';
    const steps = ['Joining server…','Finding your base…','Checking ' + bag.length + ' item' + (bag.length > 1 ? 's' : '') + '…','Sending to your game…','Almost done…'];
    let i = 0;
    const tick = () => {
      if (i < steps.length){ $('sendStep').textContent = steps[i]; bar.style.width = ((i + 1) / steps.length * 100) + '%'; i++; setTimeout(tick, 500 + Math.random() * 500); }
      else {
        $('sendProgWrap').style.display = 'none'; $('sendStep').textContent = '';
        $('sendTitle').textContent = 'CONGRATULATIONS!';
        $('sendText').innerHTML = '🎉 <b>' + bag.length + (bag.length === 1 ? ' item is' : ' items are') + '</b> ready!<br>Tap below to get them in game.';
        $('claimNow').style.display = ''; confetti();
      }
    };
    tick();
  };
  $('claimNow').onclick = () => {
    $('sendModal').classList.remove('open');
    $('wasted').textContent = spins;
    $('reveal').classList.add('open');
    if (navigator.vibrate) try { navigator.vibrate([60,40,60]); } catch(e){}
  };
  $('again').onclick = () => {
    $('reveal').classList.remove('open');
    bag.length = 0; invN = 0; spins = 0; $('spinBtn').disabled = false;
  };

  // ---- confetti
  const cf = $('confetti'), cx = cf.getContext('2d');
  let bits = [];
  function confetti(){
    const W = cf.offsetWidth, H = cf.offsetHeight, dpr = Math.min(devicePixelRatio || 1, 2);
    cf.width = W * dpr; cf.height = H * dpr; cx.setTransform(dpr,0,0,dpr,0,0);
    const cols = ['#ffd23f','#ff4b4b','#35d45a','#2f8bff','#a35bff','#ff9a1f','#ffffff'];
    for (let i = 0; i < 140; i++) bits.push({ x: W / 2, y: H * .42, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, s: Math.random() * 8 + 5, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[i % cols.length], life: 0 });
    if (!confetti.run){ confetti.run = true; requestAnimationFrame(tickC); }
  }
  function tickC(){
    const W = cf.offsetWidth, H = cf.offsetHeight;
    cx.clearRect(0,0,W,H);
    bits = bits.filter(b => b.y < H + 20 && b.life < 240);
    for (const b of bits){
      b.vy += .32; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life++;
      cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r); cx.fillStyle = b.c; cx.strokeStyle = '#10213a'; cx.lineWidth = 2;
      cx.fillRect(-b.s / 2, -b.s / 3, b.s, b.s * .66); cx.strokeRect(-b.s / 2, -b.s / 3, b.s, b.s * .66); cx.restore();
    }
    if (bits.length) requestAnimationFrame(tickC); else { confetti.run = false; cx.clearRect(0,0,W,H); }
  }

  // ---- sparkles
  function sparkles(canvas, count, opts = {}){
    const ctx = canvas.getContext('2d');
    const cols = opts.colors || ['#ffffff','#fff3a0','#ffd23f','#ffffff'];
    let W = 0, H = 0, ps = [];
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const mk = any => ({ x: Math.random() * W, y: any ? Math.random() * H : H + 10, r: Math.random() * (opts.max || 3) + .8, c: cols[Math.random() * cols.length | 0],
      vy: -(Math.random() * (opts.speed || .25) + .05), vx: (Math.random() - .5) * .15, ph: Math.random() * 6.28, sp: Math.random() * .05 + .02 });
    function size(){ W = canvas.offsetWidth; H = canvas.offsetHeight; canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0); ps = Array.from({length: count}, () => mk(true)); }
    function frame(){
      ctx.clearRect(0,0,W,H);
      for (const p of ps){
        p.x += p.vx; p.y += p.vy; p.ph += p.sp; if (p.y < -10) Object.assign(p, mk(false));
        const a = Math.max(0, Math.sin(p.ph)) * .9 + .1, s = p.r * 3 * (.6 + a * .6);
        ctx.save(); ctx.translate(p.x, p.y); ctx.globalAlpha = a; ctx.fillStyle = p.c; ctx.shadowColor = p.c; ctx.shadowBlur = 10; ctx.beginPath();
        ctx.moveTo(0,-s); ctx.quadraticCurveTo(0,0,s,0); ctx.quadraticCurveTo(0,0,0,s); ctx.quadraticCurveTo(0,0,-s,0); ctx.quadraticCurveTo(0,0,0,-s); ctx.fill(); ctx.restore();
      }
      requestAnimationFrame(frame);
    }
    if (window.ResizeObserver) new ResizeObserver(size).observe(canvas); else addEventListener('resize', size);
    size(); frame();
  }
  sparkles($('sparkles'), 40);
  sparkles($('sendSparkles'), 40, { max: 3.6, speed: .4, colors:['#ffffff','#fff3a0','#ffd23f','#7dff8f','#ffffff'] });
  sparkles($('panelSparkles'), 40, { max: 3.6, speed: .4, colors:['#ffffff','#fff3a0','#ffd23f','#7dff8f','#ffffff'] });
})();
</script>
